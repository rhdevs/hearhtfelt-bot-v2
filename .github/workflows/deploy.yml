name: Build and Deploy heartfelt-bot

on:
  push:
    branches: [main]
  # Pull requests are what make the gate useful: the tests run BEFORE the merge
  # that deploys. A PR run never builds, never pushes to GHCR and never SSHes.
  pull_request:
  workflow_dispatch:

# INVARIANT: two deploys must never run at once, and a PR run must never delay or
# cancel an in-flight deploy.
#
# The group is ref-scoped so main-deploys serialise against each other while each
# PR gets its own lane -- with a single shared group, a live deploy could queue
# behind unrelated PR test runs. cancel-in-progress is true ONLY for pull_request,
# so a superseded PR run is dropped but a deploy is never interrupted.
concurrency:
  group: deploy-heartfelt-bot-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/rhdevs/heartfelt-bot

jobs:
  # This job gates deploys to a live mental-health helpline. It must have NO
  # access to secrets: no MONGODB_URI, no BOT_TOKEN, no droplet key. Every suite
  # runs against fakes. Do not add a `secrets.` reference to this job.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Every suite prints emoji. On a non-UTF-8 stdio this raises
      # UnicodeEncodeError, which reads like a test failure. Ubuntu almost
      # certainly does not need this (PEP 538/540), but it is free and makes the
      # CI invocation byte-identical to the documented local one.
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the Dockerfile's `FROM python:3.12-slim`.
          # No `cache: pip`: three small wheels, and the cache is one more thing
          # that can flake in front of a deploy gate.
          python-version: '3.12'

      - name: Install pinned dependencies
        run: python -m pip install --upgrade pip

      # Installs exactly python-telegram-bot==22.2, python-dotenv==1.0.0 and
      # pymongo==4.6.0 -- the same set the image gets. No pytest, no extras.
      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Resolved dependency versions
        run: pip freeze

      # Catches syntax errors in modules no test imports (e.g. src/database/utils.py).
      - name: Byte-compile every module
        run: python -m compileall -q -x '_deployed_reference|[.]venv|venv' .

      # One step per file: the Actions UI then names the broken suite, and there
      # are no shell exit-code semantics to get wrong. Do NOT collapse into a loop.
      #
      # Do NOT add `-W error`: tests/test_restore.py deliberately calls the
      # deprecated datetime.datetime.utcnow() to build a legacy naive timestamp,
      # and -W error would turn that into a false failure.
      #
      # ADMIN_CHANNEL_ID is deliberately NOT set. All suites pass with and without
      # it; setting it makes enabled_services() non-empty and silently changes
      # default_service_key() for every suite.
      #
      # There is no .env in the repo and none may ever be created here. config.py
      # calls load_dotenv(), which reads ./.env only; .env.production is local and
      # gitignored, and nothing in this job may reference it.
      #
      # Deliberately excluded:
      #   tests/test_db_integration.py  -- needs a live Mongo and WRITES DOCUMENTS.
      #                                    There must never be a MONGODB_URI secret
      #                                    in this job.
      #   tests/demo_session_expiry.py  -- a demonstration script with zero
      #                                    assertions; it always exits 0.
      - name: tests/test_dependency_pins.py
        run: python tests/test_dependency_pins.py

      - name: tests/test_boot.py
        run: python tests/test_boot.py

      - name: tests/test_timeutil.py
        run: python tests/test_timeutil.py

      - name: tests/test_service_config.py
        run: python tests/test_service_config.py

      - name: tests/test_copy.py
        run: python tests/test_copy.py

      - name: tests/test_pss_flow.py
        run: python tests/test_pss_flow.py

      - name: tests/test_per_service_timers.py
        run: python tests/test_per_service_timers.py

      - name: tests/test_restore.py
        run: python tests/test_restore.py

      - name: tests/test_session_expiry.py
        run: python tests/test_session_expiry.py

  build-and-push:
    # A red test job blocks the build, and therefore the deploy.
    needs: test
    # A pull request runs the tests and stops there: no GHCR write, no SSH, no
    # secrets. Only push-to-main and workflow_dispatch continue past here.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # No `if:` needed and none wanted: a skipped dependency skips the dependent,
    # so a pull request never reaches this job. Never add `if: always()` here.
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to droplet
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" \
            "GHCR_TOKEN='$GHCR_TOKEN' GHCR_USER='$GHCR_USER' IMAGE='${{ env.IMAGE }}:latest' bash -s" \
            < deploy/deploy.sh
